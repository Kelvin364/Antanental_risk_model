name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Verify the data file
        run: echo "ab95366ef22dde5d13df93f10723942f5faffda8fbf0007e8efe85e4f25c1126  data/maternal_dataset_csv.csv" | sha256sum --check
      - name: Lint
        run: |
          ruff check src tests webapp
          black --check src tests webapp
      - name: Test with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
