name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Verify the data file
        run: echo "ab95366ef22dde5d13df93f10723942f5faffda8fbf0007e8efe85e4f25c1126  data/maternal_dataset_csv.csv" | sha256sum --check
      - name: Lint
        run: |
          ruff check src tests webapp scripts
          black --check src tests webapp scripts
      - name: Check the interface's API schema is current
        run: python scripts/export_openapi.py --check
      - name: Test with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check the generated client matches openapi.json
        run: npm run gen:types && git diff --exit-code src/lib/api-schema.ts
      - run: npm run typecheck
      - run: npm run build

  security:
    # Known vulnerabilities in the pinned Python and interface dependencies (Stage 6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit the Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit the interface dependencies used at run time
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  deploy:
    # Runs only when the repository variable FLY_DEPLOY is "true" and the
    # FLY_API_TOKEN secret is set (README, Getting started).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FLY_DEPLOY == 'true'
    needs: [test, interface]
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

