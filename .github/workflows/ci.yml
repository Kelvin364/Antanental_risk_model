name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Verify the data file
        run: echo "ab95366ef22dde5d13df93f10723942f5faffda8fbf0007e8efe85e4f25c1126  data/maternal_dataset_csv.csv" | sha256sum --check
      - name: Lint
        run: |
          ruff check src tests webapp scripts
          black --check src tests webapp scripts
      - name: Check the interface's API schema is current
        run: python scripts/export_openapi.py --check
      - name: Test with coverage
        run: pytest --cov --cov-report=term --cov-report=xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  postgres:
    # The prototype on PostgreSQL, as deployed on Render (docs/deviations.md).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: antenatal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
      - name: Test on PostgreSQL
        env:
          ANTENATAL_TEST_POSTGRES_URL: postgresql://postgres:ci@localhost:5432/antenatal_test
        run: pytest tests/postgres -o addopts="" -q

  interface:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check the generated client matches openapi.json
        run: npm run gen:types && git diff --exit-code src/lib/api-schema.ts
      - run: npm run typecheck
      - run: npm run build

  security:
    # Known vulnerabilities in the pinned Python and interface dependencies (Stage 6).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit the Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit the interface dependencies used at run time
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  deploy:
    # Starts a Render deploy only when the repository variable RENDER_DEPLOY is "true" and
    # the RENDER_DEPLOY_HOOK_URL secret is set, after every test job has passed
    # (README, Deploying on Render).
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.RENDER_DEPLOY == 'true'
    needs: [test, postgres, interface]
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - name: Trigger the Render deploy hook
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL" > /dev/null
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

