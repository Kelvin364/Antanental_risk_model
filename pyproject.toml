[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "antenatal"
version = "1.0.0"
description = "Incremental predictive value of two antenatal visits for recorded low birth weight"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kelvin Rwihimba" }]

[project.scripts]
antenatal = "antenatal.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"antenatal.reporting" = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: runs part of the analysis on the real data file"]

[tool.coverage.run]
source = ["antenatal", "webapp/app"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
# Exception names follow the study vocabulary (ChecksumMismatch, HoldoutAccessRefused).
ignore = ["N818"]
